services:
  postgres:
    image: postgres:16-alpine
    container_name: remix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: remix
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: remix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remix"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - remix-net

  app:
    build: .
    container_name: remix-app
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: remix
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: remix
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - remix-net

  nginx:
    image: nginx:alpine
    container_name: remix-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - remix-net

networks:
  remix-net:
    driver: bridge

volumes:
  pgdata:
