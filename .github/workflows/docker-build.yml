name: Build & Push Docker Image

on:
  push:
    branches: [new-backend]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/achadinhospromosdagleici-dev/remix-of-message-flow:latest
            ghcr.io/achadinhospromosdagleici-dev/remix-of-message-flow:${{ github.sha }}
