services:
  postgres:
    image: postgres:16-alpine
    container_name: remix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: remix
      POSTGRES_PASSWORD: remix123
      POSTGRES_DB: remix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remix"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: remix-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: remix
      PG_PASSWORD: remix123
      PG_DATABASE: remix
      JWT_SECRET: ${JWT_SECRET:-minha-chave-secreta-super-segura-123}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
