version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: remix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: remix
      POSTGRES_PASSWORD: remix123
      POSTGRES_DB: remix
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
